name: Stream Video to YouTube

on:
  workflow_dispatch:
    inputs:
      video_filename:
        description: 'Exact filename in video-storage release'
        required: true
        type: string
      stream_key:
        description: 'YouTube Live Stream Key'
        required: true
        type: string
      loop:
        description: 'Loop video (true or false)'
        required: true
        default: 'false'
        type: string
      rtmp_url:
        description: 'RTMP Server URL'
        required: false
        default: 'rtmp://a.rtmp.youtube.com/live2'
        type: string

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Video from GitHub Storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download video-storage \
            -R "${{ github.repository }}" \
            -p "${{ github.event.inputs.video_filename }}"

      - name: Stream to YouTube Live
        env:
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          RTMP_URL: ${{ github.event.inputs.rtmp_url }}
          VIDEO_FILE: ${{ github.event.inputs.video_filename }}
          LOOP_FLAG: ${{ github.event.inputs.loop }}
        run: |
          if [ "$LOOP_FLAG" = "true" ]; then
            LOOP_ARGS="-stream_loop -1"
          else
            LOOP_ARGS=""
          fi

          ffmpeg -re $LOOP_ARGS -i "$VIDEO_FILE" \
            -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k \
            -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "${RTMP_URL}/${STREAM_KEY}"
            
